spring:
  application:
    name: wallet-p2p

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wallet}
    hikari:
      # Keep well under the database's max_connections, especially on a free tier
      # where that ceiling is low and the app should not be the reason Postgres
      # starts refusing connections.
      maximum-pool-size: ${DB_MAX_CONNS:20}
      minimum-idle: ${DB_MIN_CONNS:2}
      connection-timeout: 10000
      max-lifetime: 1800000
      # Free-tier Postgres cold-starts; fail slowly at boot rather than crash-loop
      # before the database has woken up.
      initialization-fail-timeout: 60000

  sql:
    init:
      # One idempotent CREATE-IF-NOT-EXISTS script rather than a migration
      # framework: with one table group and no production history to preserve,
      # the framework is an operational surface bought for nothing.
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

  mvc:
    async:
      # The /logs SSE tail is deliberately unbounded; per-request limits come from
      # the handlers, not from a global async deadline that would sever it.
      request-timeout: -1

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

# Graceful shutdown: stop accepting, let in-flight money transactions finish
# rather than aborting a half-committed request during a rolling deploy.
lifecycle:
  timeout-per-shutdown-phase: 15s

management:
  endpoints:
    web:
      base-path: ""
      exposure:
        include: prometheus
      path-mapping:
        # The brief asks for /metrics, not /actuator/prometheus.
        prometheus: metrics
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: wallet-p2p
    distribution:
      # Percentile histograms are what make a real p99 possible. Buckets skew low
      # and tight because this is a single-digit-millisecond write path and p99 is
      # meaningless if every request lands in the first bucket.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 1ms,2500us,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 5s

app:
  admin-token: ${ADMIN_TOKEN:dev-admin-token}
  version: ${APP_VERSION:dev}
  invariant-sample: ${INVARIANT_SAMPLE:PT15S}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.dhaval.wallet: ${LOG_LEVEL:INFO}
