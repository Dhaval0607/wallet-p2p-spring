# Render Blueprint. Brings up the app and its Postgres together.
#
#   Render dashboard -> New -> Blueprint -> pick this repo
#
# Everything below is on Render's free tier: no card, ₹0.
services:
  - type: web
    name: wallet-p2p-spring
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # closest to the database and to India
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: ADMIN_TOKEN
        generateValue: true    # Render generates a secret; read it in the dashboard
      - key: LOG_LEVEL
        value: INFO
      # Render's free Postgres allows very few connections, and the free web
      # service is a single instance. A small pool avoids the app itself being
      # the reason the database refuses connections.
      - key: DB_MAX_CONNS
        value: "8"
      - key: DB_MIN_CONNS
        value: "1"
      # How often the background auditor recomputes the invariants from the base
      # tables and publishes them as gauges. An ISO-8601 duration.
      - key: INVARIANT_SAMPLE
        value: PT15S
      # One account gets one free Postgres, so this database is shared. The app
      # keeps its tables in a dedicated `wallet` schema (see schema.sql) rather
      # than in `public`, which is where a co-tenant's tables would collide.
      - key: APP_VERSION
        fromService:
          name: wallet-p2p-spring
          type: web
          property: host

databases:
  - name: wallet-db
    plan: free
    region: singapore
    databaseName: wallet
    user: wallet
