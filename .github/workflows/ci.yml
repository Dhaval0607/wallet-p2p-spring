name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The invariants live in Postgres, so CI runs against a real Postgres. A mocked
  # database would make these tests green and meaningless.
  test:
    name: invariant tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: test
        env:
          TEST_DATABASE_URL: postgresql://wallet:wallet@localhost:5432/wallet_test
        run: mvn -B verify

  # Proves the case a reviewer actually cares about: a clean checkout builds and
  # comes up with one command, and passes the same burst that runs against the
  # deployed URL.
  compose-burst:
    name: clean-checkout compose + burst
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: docker compose up (fresh clone, one command)
        run: docker compose up --build -d --wait

      - name: wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz | grep -q ready; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "never became ready"; docker compose logs --no-color app; exit 1

      - name: container hygiene -- non-root, healthcheck present
        run: |
          user="$(docker inspect "$(docker compose ps -q app)" --format '{{.Config.User}}')"
          health="$(docker inspect "$(docker compose ps -q app)" --format '{{.State.Health.Status}}')"
          echo "runs as: ${user:-<root>}   health: $health"
          [ -n "$user" ] && [ "$user" != "root" ] || { echo "FAIL: container runs as root"; exit 1; }
          [ "$health" = "healthy" ] || { echo "FAIL: healthcheck is $health"; exit 1; }

      - name: burst -- all invariant gates
        env:
          ADMIN_TOKEN: dev-admin-token
        run: ./scripts/burst.sh http://localhost:8080

      - name: heavy burst -- 1500 transfers at 100-way concurrency
        env:
          ADMIN_TOKEN: dev-admin-token
          N_WALLET_RACERS: "100"
          K_IDEMPOTENT: "60"
          N_TRANSFERS: "1500"
          N_PARALLEL: "100"
          N_WALLETS: "6"
        run: ./scripts/burst.sh http://localhost:8080

      # If the sorted-lock discipline regresses, this is where it shows up:
      # deadlocks appear as retries, and exhausted retries as 500s.
      - name: assert zero deadlocks and zero 5xx
        run: |
          m="$(curl -fsS http://localhost:8080/metrics)"
          retries="$(printf '%s' "$m" | awk '/^wallet_db_retries/ {s+=$2} END {print s+0}')"
          errors="$(printf '%s' "$m" | awk '/^http_server_requests_seconds_count.*SERVER_ERROR/ {s+=$2} END {print s+0}')"
          echo "db tx retries: $retries    5xx responses: $errors"
          if [ "${retries%.*}" != "0" ] || [ "${errors%.*}" != "0" ]; then
            docker compose logs --no-color app | tail -100
            echo "FAIL: expected zero deadlock retries and zero 5xx"; exit 1
          fi

      - name: final invariant audit
        run: curl -fsS http://localhost:8080/invariants | tee /dev/stderr | grep -q '"all_invariants_hold":true'

      - name: dump app logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: tear down
        if: always()
        run: docker compose down -v
