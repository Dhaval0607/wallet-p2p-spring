# One command brings up the whole thing:
#
#   docker compose up --build -d --wait
#
# then:  ./scripts/burst.sh http://localhost:8080
#
# No .env file is required -- every value below has a working default.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    command:
      - postgres
      # The burst opens ~100 connections; the default 100 leaves no headroom for
      # the pool's idle conns plus a psql session to look around with.
      - -c
      - max_connections=200
      # Log every deadlock and every lock wait over 1s. If the locking discipline
      # ever regresses, the evidence is already being captured.
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits on this, so a first `compose up` does not race initdb.
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
      PORT: "8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_MAX_CONNS: "20"
      APP_VERSION: ${VERSION:-compose}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
